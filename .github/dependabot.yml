# Weekly version updates; security updates are enabled in repository settings.
# Minor and patch releases are grouped; major releases remain separate.
version: 2
updates:
- package-ecosystem: docker
  directories:
  - /google-cloud-run
  - /graphhopper
  - /mqtt
  - /paradedb/sqlc
  - /playwrightpdf/playwright-service
  - /pulumi-frp
  - /timescaledb/sqlc
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
